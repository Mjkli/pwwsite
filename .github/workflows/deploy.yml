name: Deploy to public
on:
  push:
    tags:
      - 'release/*'

jobs:
  branch_check:
    name: Main check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to a commit on the default branch
        run: |
          git fetch --no-tags --prune origin
          default_branch=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')

          if [ -z "$default_branch" ]; then
            for candidate in main master; do
              if git ls-remote --exit-code --heads origin "$candidate" >/dev/null 2>&1; then
                default_branch="$candidate"
                break
              fi
            done
          fi

          if [ -z "$default_branch" ]; then
            echo "Could not determine the default branch from origin"
            exit 1
          fi

          if git merge-base --is-ancestor HEAD "origin/$default_branch"; then
            echo "Tag points to a commit that is already on $default_branch"
          else
            echo "Tag is not on $default_branch"
            exit 1
          fi

  infrastructure:
    name: Deploy website to AWS
    runs-on: ubuntu-latest
    container: mjkli/terraform-aws:latest
    needs: ["branch_check"]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-west-1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Terraform init
        run: terraform init
        working-directory: tf-infra

      - name: Terraform validate
        run: terraform validate
        id: validate
        working-directory: tf-infra

      - name: Terraform validate status
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false
        working-directory: tf-infra

      - name: Terraform plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1
  
  Upload:
    name: Upload to s3 bucket
    runs-on: ubuntu-latest
    container: mjkli/terraform-aws:latest
    needs: ["infrastructure", "branch_check"]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-west-1"
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: pww-build
          path: dist/
      
      - name: Upload to s3 bucket
        run: aws s3 sync dist/ s3://pww-mjkli-bucket
